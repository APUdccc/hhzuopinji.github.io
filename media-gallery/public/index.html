<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地媒体库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2337b6ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M12 9.5l11 6.5-11 6.5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4.5V11h-6.5"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-crop" viewBox="0 0 24 24"><path d="M7 3v14h14M3 7h14v14"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4l9 5-9 5-9-5zM3 14l9 5 9-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9.5 16h-19z"/><path d="M12 10v4.5M12 17.5h.01"/></symbol>
  </defs>
</svg>

<div id="app" class="app">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnSide" title="目录"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div class="brand">
      <span class="logo"><svg class="ic"><use href="#i-play"/></svg></span>
      <span class="brand-name">媒体库</span>
    </div>
    <nav class="tabs" id="modeTabs">
      <button class="tab" data-mode="video"><svg class="ic"><use href="#i-video"/></svg><span>视频</span></button>
      <button class="tab" data-mode="image"><svg class="ic"><use href="#i-image"/></svg><span>图片</span></button>
      <button class="tab" data-mode="fav"><svg class="ic"><use href="#i-star"/></svg><span>收藏夹</span></button>
    </nav>
    <label class="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="搜索名称或目录…  ( / )" autocomplete="off">
    </label>
    <div class="tools">
      <select id="sort" class="select" title="排序">
        <option value="name">名称</option>
        <option value="mtime">修改时间</option>
        <option value="size">大小</option>
        <option value="res">分辨率</option>
        <option value="type">类型</option>
      </select>
      <button class="icon-btn" id="order" title="升序 / 降序">↑</button>
      <div class="seg" id="viewSeg">
        <button data-view="grid" title="网格"><svg class="ic"><use href="#i-grid"/></svg></button>
        <button data-view="list" title="列表"><svg class="ic"><use href="#i-list"/></svg></button>
      </div>
      <input id="size" class="range" type="range" min="140" max="420" step="10" title="缩略图大小">
      <button class="icon-btn" id="fit" title="缩略图：裁切 / 完整"><svg class="ic"><use href="#i-crop"/></svg></button>
      <button class="icon-btn" id="theme" title="切换主题"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button class="btn ghost" id="btnAdmin"><svg class="ic"><use href="#i-settings"/></svg><span>后台</span></button>
    </div>
  </header>

  <aside class="side" id="side">
    <div class="side-sec">
      <div class="side-h"><span>媒体源</span><button class="mini" id="btnAddRoot" title="添加路径"><svg class="ic"><use href="#i-plus"/></svg></button></div>
      <div id="tree" class="tree"></div>
    </div>
    <div class="side-sec">
      <div class="side-h"><span>收藏的文件夹</span></div>
      <div id="favDirs" class="tree"></div>
    </div>
  </aside>
  <div class="side-mask" id="sideMask"></div>

  <main class="main" id="main">
    <div class="mhead">
      <div class="crumbs" id="crumbs"></div>
      <div class="mactions" id="mactions"></div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="banner"></div>
    <div id="grid" class="grid"></div>
    <div id="sentinel" class="sentinel"></div>
  </main>
</div>

<!-- 查看器 -->
<div id="viewer" class="viewer" hidden>
  <div class="v-top">
    <div class="v-title"><span id="vTitle"></span><small id="vSub"></small></div>
    <div class="v-count" id="vCount"></div>
    <div class="v-btns">
      <button class="v-btn" id="vSlide" title="幻灯片播放 (空格)"><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="v-btn" id="vInfo" title="详情 (I)"><svg class="ic"><use href="#i-info"/></svg></button>
      <button class="v-btn" id="vFav" title="收藏 (F)"><svg class="ic"><use href="#i-star"/></svg></button>
      <button class="v-btn" id="vFull" title="全屏"><svg class="ic"><use href="#i-full"/></svg></button>
      <button class="v-btn" id="vClose" title="关闭 (Esc)"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
  </div>
  <button class="v-nav prev" id="vPrev" title="上一个 (←)"><svg class="ic"><use href="#i-left"/></svg></button>
  <button class="v-nav next" id="vNext" title="下一个 (→)"><svg class="ic"><use href="#i-right"/></svg></button>
  <div class="v-stage" id="vStage"></div>
  <div class="v-bottom" id="vBottom"></div>
  <aside class="v-info" id="vInfoPane" hidden></aside>
</div>

<!-- 后台管理 -->
<div id="admin" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>后台管理</h2>
      <button class="icon-btn" id="adminClose"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-body" id="adminBody"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="app.js"></script>
</body>
</html>
